server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;   # upload vai direto pro MinIO, nao por aqui
    # Sem isso o redirect de /m para /m/ perde a porta publicada pelo compose.
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SSE: sem buffer e sem timeout curto, senao o stream morre a cada minuto.
    location /api/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    # O bundle sai em /static para nao colidir com a rota /assets/:id do app.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- PWA de campo, servida em /m ----
    # Bundle proprio, nao o desktop com media query. O escopo /m/ isola o
    # service worker: ele nao intercepta nada do app do NOC servido em /.

    location = /m {
        return 301 /m/;
    }

    # O service worker precisa ser revalidado sempre; se ficar em cache o
    # aparelho fica preso numa versao antiga do app para sempre.
    location = /m/sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /m/manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location /m/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    # SPA: /assets/:id e rota do front, resolvida pelo index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
