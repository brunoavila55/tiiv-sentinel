name: tiiv-sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Publicado para rodar `make test` e psql a partir do host.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sentinel}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sentinel123}
    volumes:
      - miniodata:/data
    ports:
      # A porta precisa ser alcancavel pelo NAVEGADOR: e o host das presigned URLs.
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinel}?sslmode=disable
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sentinel}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-sentinel123}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinel}
      MINIO_PRESIGN_TTL: ${MINIO_PRESIGN_TTL:-15m}
      SESSION_TTL: ${SESSION_TTL:-720h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-troque-esta-senha}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      POLL_ENABLED: ${POLL_ENABLED:-true}
      POLL_INTERVAL: ${POLL_INTERVAL:-60s}
      POLL_CONCURRENCY: ${POLL_CONCURRENCY:-50}
      POLL_TIMEOUT: ${POLL_TIMEOUT:-3s}
      PING_PRIVILEGED: ${PING_PRIVILEGED:-false}
    ports:
      # Exposta para debug e para o `vite dev` na maquina do desenvolvedor.
      - "${API_PORT:-8081}:8080"
    # ICMP sem raiz: o range libera socket ICMP nao privilegiado para o usuario
    # do container (PING_PRIVILEGED=false).
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  miniodata:
